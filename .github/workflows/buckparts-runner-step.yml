name: BuckParts Runner Step

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runner-step:
    name: Runner Step v1 (read-only JSON)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      LIVE_SITE_SMOKE_TARGET_URL: https://buckparts.com
      NEXT_PUBLIC_SITE_URL: https://buckparts.com

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Runner Step v1
        run: |
          set -euo pipefail
          node --import tsx scripts/buckparts-runner-step.ts > buckparts-runner-step.json
          test -s buckparts-runner-step.json

      - name: Append Runner Step summary
        run: |
          set -euo pipefail
          node --import tsx scripts/buckparts-runner-step-append-github-step-summary.ts buckparts-runner-step.json

      - name: Upload Runner Step JSON artifact
        uses: actions/upload-artifact@v7
        with:
          name: buckparts-runner-step
          path: buckparts-runner-step.json
          if-no-files-found: error
