name: BuckParts Daily Operator

on:
  workflow_dispatch:
    inputs:
      worker:
        description: Isolated worker to run
        required: true
        type: choice
        default: gsc
        options:
          - gsc
  schedule:
    - cron: "17 13 * * *"

permissions:
  contents: read

jobs:
  daily-operator:
    if: ${{ github.event_name == 'schedule' }}
    name: Run read-only Daily Operator
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      LIVE_SITE_SMOKE_TARGET_URL: https://buckparts.com
      NEXT_PUBLIC_SITE_URL: https://buckparts.com

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run BuckParts Daily Operator
        run: |
          daily_output="$(npm run buckparts:daily)"
          printf '%s\n' "$daily_output"
          {
            echo "## BuckParts Daily Operator"
            echo
            echo '```text'
            printf '%s\n' "$daily_output"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  gsc-measurement:
    if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.worker == 'gsc') }}
    name: Collect GSC measurement artifact
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
      GSC_PROPERTY_SITE_URL: sc-domain:buckparts.com

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Collect local-only GSC artifact
        run: npm run buckparts:gsc:fetch -- --local-only

      - name: Upload GSC measurement artifact
        uses: actions/upload-artifact@v7
        with:
          name: buckparts-gsc-search-analytics
          path: data/reports/buckparts-gsc-search-analytics.json
          if-no-files-found: error
          retention-days: 90
