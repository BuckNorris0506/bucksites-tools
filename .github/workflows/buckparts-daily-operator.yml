name: BuckParts Daily Operator

on:
  workflow_dispatch:
  schedule:
    - cron: "17 13 * * *"

permissions:
  contents: read

jobs:
  daily-operator:
    name: Run read-only Daily Operator
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      LIVE_SITE_SMOKE_TARGET_URL: https://buckparts.com
      NEXT_PUBLIC_SITE_URL: https://buckparts.com

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run BuckParts Daily Operator
        run: |
          daily_output="$(npm run buckparts:daily)"
          printf '%s\n' "$daily_output"
          {
            echo "## BuckParts Daily Operator"
            echo
            echo '```text'
            printf '%s\n' "$daily_output"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
